# docker-compose.yml
services:
  sie:
    image: ghcr.io/superlinked/sie-server:v0.9.0-cpu-transformers5
    ports:
      - "8080:8080"
    environment:
      - SIE_DEVICE=cpu
      - SIE_MAX_BATCH_REQUESTS=128
      - SIE_PRELOAD_MODELS=fastino/GLiNER2.5-Decide,topk-io/topk-embed-v1-xsmall
    ## Cache the models
    volumes:
      - 'sie-models-cache:/app/.cache/huggingface'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  sie-models-cache:
    driver: local