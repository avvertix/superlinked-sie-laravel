name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        run: composer test:types
        continue-on-error: true

      - name: Test Suite
        if: runner.os != 'Windows'
        run: |
          vendor/bin/pest ./tests/ArchTest.php
          vendor/bin/pest --ci --exclude-testsuite=Integration

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest --ci --exclude-testsuite=Integration

  integration:
    # Service containers only work on Linux runners, so the live SIE suite
    # runs in its own job instead of the OS matrix above.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    name: Integration - P8.4 - L13.* - prefer-stable

    services:
      sie:
        image: ghcr.io/superlinked/sie-server:v0.9.0-cpu-transformers5
        env:
          SIE_DEVICE: cpu
          SIE_MAX_BATCH_REQUESTS: 128
          SIE_PRELOAD_MODELS: fastino/GLiNER2.5-Decide,topk-io/topk-embed-v1-xsmall
        ports:
          - 8080:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Integration Test Suite
        env:
          SIE_ENDPOINT: http://localhost:8080
        run: vendor/bin/pest --ci --testsuite=Integration
