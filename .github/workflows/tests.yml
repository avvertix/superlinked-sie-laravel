name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [13.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    services:
      sie:
        image: ghcr.io/superlinked/sie-server:v0.7.1-cpu-default
        env:
          SIE_DEVICE: cpu
          SIE_MAX_BATCH_REQUESTS: 128
          SIE_PRELOAD_MODELS: docling,urchade/gliner_multi-v2.1,docling:ocr,NeuML/gliner-bert-tiny,BAAI/bge-m3
        ports:
          - 8080:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        run: composer test:types
        continue-on-error: true

      - name: Test Suite
        if: runner.os != 'Windows'
        env:
          SIE_ENDPOINT: http://sie:8080
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        env:
          SIE_ENDPOINT: http://sie:8080
        run: vendor/bin/pest
